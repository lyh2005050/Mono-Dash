name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Generate keystore
        working-directory: android/app
        run: |
          keytool -genkeypair -v             -keystore upload-keystore.jks             -keyalg RSA -keysize 2048 -validity 10000             -alias upload             -storepass 1panel2026             -keypass 1panel2026             -dname "CN=1Panel, OU=Dev, O=Dev, L=City, ST=State, C=CN"
      
      - name: Set signing config
        working-directory: android
        run: |
          cat > key.properties << 'EOF'
          storePassword=1panel2026
          keyPassword=1panel2026
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build APK (release)
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.4
          name: v2.1.4 - 修复防火墙删除规则404
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
